name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy (Default Features)
        run: cargo clippy -- -D warnings

      - name: Clippy (Candle Feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --features candle -- -D warnings

      - name: Clippy (MLX Feature)
        if: matrix.os == 'macos-15'
        run: cargo clippy --features mlx -- -D warnings

      - name: Run Tests (Default Features)
        run: cargo test

      - name: Run Tests (Candle Feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --features candle --lib

      - name: Run Tests (MLX Feature)
        if: matrix.os == 'macos-15'
        run: cargo test --features mlx --test mlx_sieve_test

      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo Deny Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

