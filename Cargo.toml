[package]
name = "zev-rs"
version = "0.3.1"
edition = "2021"
authors = ["Brandon Hubbard", "zev-rs contributors"]
license = "MIT"
description = "Zev: The ultimate zero-token LLM decision engine combining order-invariance, calibrated temperature, candidate-only projection, and guardrails"
repository = "https://github.com/bhubbard/zev-rs"
homepage = "https://github.com/bhubbard/zev-rs"
readme = "README.md"
keywords = ["zev", "jev", "decision-model", "order-invariant", "calibration"]
categories = ["science", "web-programming::http-server"]
exclude = [
    "datasets/*",
    "tests/scale_2000_tests.rs",
    "hf-space/*",
    "scripts/*",
    "docs/*",
    ".github/*",
    "bin/*",
]

[lib]
name = "zev"
path = "src/lib.rs"

[[bin]]
name = "zev"
path = "src/bin/zev.rs"

[[bin]]
name = "generate_2000_tests"
path = "src/bin/generate_2000_tests.rs"

[[bin]]
name = "export_hf_dataset"
path = "src/bin/export_hf_dataset.rs"

[[bin]]
name = "convert_head"
path = "src/bin/convert_head.rs"
required-features = ["candle"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", optional = true }
apfel = { package = "apfel-rs", version = "0.1", optional = true }
smallvec = "1.14"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
regex = { version = "1", optional = true }
half = { version = "2", optional = true }
serde-pickle = "1.2"
zip = "8.6.0"
rand = "0.9"

[features]
default = ["server"]
server = ["dep:axum"]
neural = ["dep:apfel"]
# Kev checkpoints (Qwen3.5 hybrid + LoRA + pointer head) on Candle; `cuda` adds the GPU path and the DeltaNet kernel
candle = ["server", "dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:regex", "dep:half"]
cuda = ["candle", "candle-core/cuda", "candle-nn/cuda"]

[dev-dependencies]
approx = "0.5"
tower = { version = "0.5", features = ["util"] }
